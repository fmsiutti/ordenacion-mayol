<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Regalos de Ordenación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bordo: #6b1424;
    --bordo-hover: #84203a;
    --oro: #b08d45;
    --oro-suave: #e3d3ad;
    --blanco: #ffffff;
    --marfil: #fbf9f5;
    --tinta: #2b1a1d;
    --tinta-suave: #7a686a;
    --linea: #eee7da;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--blanco);
    color: var(--tinta);
    font-family: "Lato", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body.bloqueado { overflow: hidden; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    height: 78vh;
    min-height: 460px;
    background:
      linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.35) 50%, rgba(0,0,0,.5) 100%),
      url("img/hero.jpg") center 50% / cover no-repeat,
      #1a1210;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; pointer-events: none;
  }
  .hero::before { inset: 22px; border: 1px solid var(--oro-suave); opacity: .7; }
  .hero::after  { inset: 30px; border: 1px solid var(--oro-suave); opacity: .3; }

  .ornamento {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin: 56px auto 40px; color: var(--oro);
  }
  .ornamento span { height: 1px; width: min(120px, 25vw); background: linear-gradient(90deg, transparent, var(--oro)); }
  .ornamento span:last-child { transform: scaleX(-1); }

  /* ---------- Lista ---------- */
  main { max-width: 1120px; margin: 0 auto; padding: 0 16px 96px; }
  .grid {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
  }
  .item {
    background: var(--blanco);
    border: 1px solid var(--linea);
    display: flex; flex-direction: column;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s;
  }
  .item:hover { transform: translateY(-3px); border-color: var(--oro-suave); box-shadow: 0 16px 32px -22px rgba(107,20,36,.35); }
  .foto {
    aspect-ratio: 1 / 1;
    display: grid; place-items: center;
    padding: 18px;
  }
  .foto img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .info { padding: 4px 20px 22px; display: flex; flex-direction: column; gap: 8px; flex: 1; text-align: center; }
  .info h2 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600; font-size: 1.4rem; line-height: 1.15;
    color: var(--bordo);
  }
  .info p { font-size: .86rem; line-height: 1.5; color: var(--tinta-suave); margin-bottom: 8px; }
  .precio {
    margin-top: auto;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.3rem; font-weight: 600; color: var(--oro);
    font-variant-numeric: lining-nums tabular-nums;
  }
  .comprar {
    margin-top: 10px;
    font: 700 .74rem/1 "Lato", sans-serif; letter-spacing: .16em; text-transform: uppercase;
    color: var(--bordo); background: transparent;
    border: 1px solid var(--bordo); padding: 13px 14px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .comprar:hover, .comprar:focus-visible { background: var(--bordo); color: #fff; outline: none; }

  footer { height: 4px; background: var(--oro); opacity: .6; }

  /* ---------- Checkout ---------- */
  .velo {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(43,26,29,.35);
    backdrop-filter: blur(3px);
    display: grid; place-items: center;
    padding: 16px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .velo.abierto { opacity: 1; pointer-events: auto; }
  .checkout {
    position: relative;
    width: 100%; max-width: 460px; max-height: calc(100vh - 32px); overflow-y: auto;
    background: var(--blanco);
    border-top: 3px solid var(--oro);
    padding: 32px 28px 28px;
    box-shadow: 0 30px 60px -20px rgba(43,26,29,.4);
    transform: translateY(10px); transition: transform .25s ease;
  }
  .velo.abierto .checkout { transform: none; }
  .cerrar {
    position: absolute; top: 10px; right: 10px;
    width: 36px; height: 36px; border: 0; background: transparent;
    color: var(--tinta-suave); font-size: 1.5rem; line-height: 1; cursor: pointer;
  }
  .cerrar:hover { color: var(--bordo); }
  .resumen { display: flex; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--linea); }
  .resumen img { width: 72px; height: 72px; object-fit: contain; border: 1px solid var(--linea); padding: 6px; flex-shrink: 0; }
  .resumen h3 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.35rem; font-weight: 600; color: var(--bordo); line-height: 1.15; }
  .resumen .precio { display: block; margin-top: 4px; font-size: 1.2rem; }
  .banco {
    margin: 20px 0 6px;
    font: 700 .72rem/1 "Lato", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--oro);
  }
  .datos { list-style: none; }
  .datos li {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--linea);
  }
  .datos li:last-child { border-bottom: 0; }
  .datos .etq { display: block; font-size: .72rem; color: var(--tinta-suave); margin-bottom: 3px; }
  .datos .val { display: block; font-size: .95rem; font-weight: 700; color: var(--tinta); word-break: break-word; font-variant-numeric: tabular-nums; }
  .copiar {
    flex-shrink: 0;
    font: 700 .66rem/1 "Lato", sans-serif; letter-spacing: .12em; text-transform: uppercase;
    color: var(--bordo); background: var(--marfil);
    border: 1px solid var(--linea); padding: 8px 10px; cursor: pointer;
    min-width: 76px;
  }
  .copiar:hover { border-color: var(--bordo); }
  .copiar.ok { color: #fff; background: var(--bordo); border-color: var(--bordo); }

  /* ---------- Mensaje ---------- */
  .mensaje { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--linea); }
  .mensaje .banco { margin-top: 0; margin-bottom: 14px; }
  .campo { display: block; margin-bottom: 12px; }
  .campo span { display: block; font-size: .72rem; color: var(--tinta-suave); margin-bottom: 5px; }
  .campo input, .campo textarea {
    width: 100%; font: 400 .95rem/1.4 "Lato", sans-serif; color: var(--tinta);
    background: var(--blanco); border: 1px solid var(--linea); padding: 10px 12px;
    border-radius: 0; transition: border-color .2s;
  }
  .campo textarea { min-height: 96px; resize: vertical; }
  .campo input:focus, .campo textarea:focus { outline: none; border-color: var(--oro); }
  .honey { position: absolute; left: -9999px; }
  .enviar { width: 100%; margin-top: 4px; }
  .enviar:disabled { opacity: .6; cursor: wait; }
  .estado { margin-top: 10px; font-size: .85rem; text-align: center; color: var(--tinta-suave); min-height: 1.2em; }
  .estado.error { color: var(--bordo); }
  .gracias { text-align: center; padding: 14px 0 4px; }
  .gracias p { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.35rem; color: var(--bordo); }
  .gracias svg { color: var(--oro); margin-bottom: 6px; }

  @media (max-width: 520px) {
    .hero { height: 70vh; min-height: 420px; background-position: center, center 52%, center; }
    .hero::before { inset: 12px; } .hero::after { inset: 18px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 14px; }
    .foto { padding: 10px; }
    .info { padding: 2px 12px 14px; }
    .info h2 { font-size: 1.15rem; }
    .info p { font-size: .78rem; }
    .comprar { padding: 11px 8px; letter-spacing: .12em; }
    .checkout { padding: 28px 20px 20px; }
  }
</style>
</head>
<body>

<header class="hero" role="img" aria-label="Elevación de la Hostia en la Santa Misa"></header>

<div class="ornamento" aria-hidden="true">
  <span></span>
  <svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 1v20M3 8h16" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
  <span></span>
</div>

<main>
  <ul class="grid" id="lista"></ul>
</main>

<footer></footer>

<div class="velo" id="velo" aria-hidden="true">
  <div class="checkout" role="dialog" aria-modal="true" aria-labelledby="co-nombre">
    <button class="cerrar" id="cerrar" aria-label="Cerrar">&times;</button>
    <div class="resumen">
      <img id="co-img" alt="">
      <div>
        <h3 id="co-nombre"></h3>
        <span class="precio" id="co-precio"></span>
      </div>
    </div>
    <p class="banco">Banco Santander</p>
    <ul class="datos" id="co-datos"></ul>

    <form class="mensaje" id="form-msg" novalidate>
      <p class="banco">Dejale un mensaje</p>
      <label class="campo"><span>Nombre</span><input type="text" name="nombre" id="f-nombre" autocomplete="name" maxlength="120" required></label>
      <label class="campo"><span>Mensaje</span><textarea name="mensaje" id="f-mensaje" maxlength="3000" required></textarea></label>
      <input class="honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="comprar enviar" type="submit" id="f-enviar">Enviar mensaje</button>
      <p class="estado" id="f-estado" role="status"></p>
    </form>
    <div class="gracias" id="gracias" hidden>
      <svg width="26" height="26" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 1v20M3 8h16" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      <p>¡Gracias! Tu mensaje fue enviado.</p>
    </div>
  </div>
</div>

<script>
  const regalos = [
    ["crismera",   "Crismera",                 "Pequeño recipiente con el óleo de los enfermos para administrar el sacramento de la extremaunción.", "$ 131.500"],
    ["bolso",      "Bolso visita de enfermos", "Bolso de mano para guardar lo necesario en las visitas de enfermos.", "$ 50.000"],
    ["candelabro", "Candelabros pequeños",     "Dos candeleros de bronce para colocar las velas encendidas en la comunión de los enfermos.", "U$ 50"],
    ["lienzos",    "Lienzos de comunión",      "Lienzos de lino para purificación en la comunión de los enfermos.", "U$ 25"],
    ["teca",       "Teca",                     "Cajita dorada para transportar el Santísimo Sacramento en la visita a los enfermos.", "$ 92.000"],
    ["caliz",      "Dorado del cáliz",         "El cáliz debe ser dorado para poder ser consagrado por el obispo y utilizado en la Santa Misa.", "U$ 1.000"],
    ["aspersorio", "Aspersorio móvil",         "Pequeño recipiente para asperjar agua bendita en las bendiciones.", "$ 79.000"],
    ["funda",      "Funda de breviario",       "Funda de cuero para proteger el libro del Breviario.", "U$ 25"],
    ["misal",      "Misal de viaje",           "Libro para la celebración de la Santa Misa.", "U$ 220"],
    ["manteles",   "Manteles de altar",        "Juego de tres manteles de lino para cubrir el altar de la Santa Misa.", "$ 35.000"],
    ["corporal",   "Corporal griego",          "Lienzo donde se colocan las reliquias para celebrar la Santa Misa.", "U$ 16"],
    ["ebook",      "E-book",                   "Libro digital para los estudios sacerdotales.", "$ 400.000"],
    ["notebook",   "Computadora portátil",     "", "U$ 500"],
  ];

  const cuenta = [
    ["Número de cuenta",     "CAJA DE AHORRO EN PESOS 801-352875/6", "801-352875/6"],
    ["Número de CBU",        "0720801888000035287568"],
    ["Alias",                "juan.maria.mayol"],
    ["Titular de la cuenta", "JUAN MARIA MAYOL OLACIREGUI"],
    ["Documento",            "CUIT 20-40640676-9", "20406406769"],
  ];

  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  document.getElementById("lista").innerHTML = regalos.map(([img, nombre, desc, precio], i) => `
    <li class="item">
      <div class="foto"><img src="img/${img}.jpg" alt="${esc(nombre)}" loading="lazy"></div>
      <div class="info">
        <h2>${esc(nombre)}</h2>
        ${desc ? `<p>${esc(desc)}</p>` : ""}
        <span class="precio">${esc(precio)}</span>
        <button class="comprar" data-i="${i}">Comprar</button>
      </div>
    </li>`).join("");

  document.getElementById("co-datos").innerHTML = cuenta.map(([etq, val, copia]) => `
    <li>
      <div><span class="etq">${esc(etq)}</span><span class="val">${esc(val)}</span></div>
      <button class="copiar" data-copia="${esc(copia || val)}">Copiar</button>
    </li>`).join("");

  const velo = document.getElementById("velo");
  let origen = null;
  let actual = "";
  const DESTINO = "https://formsubmit.co/ajax/pmayololaciregui@gmail.com";
  const form = document.getElementById("form-msg");
  const estado = document.getElementById("f-estado");
  const enviarBtn = document.getElementById("f-enviar");
  const gracias = document.getElementById("gracias");

  function resetForm() {
    form.reset(); form.hidden = false; gracias.hidden = true;
    estado.textContent = ""; estado.classList.remove("error");
    enviarBtn.disabled = false; enviarBtn.textContent = "Enviar mensaje";
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const nombre = document.getElementById("f-nombre").value.trim();
    const mensaje = document.getElementById("f-mensaje").value.trim();
    if (!nombre || !mensaje) {
      estado.textContent = "Completá tu nombre y el mensaje.";
      estado.classList.add("error"); return;
    }
    if (form._honey.value) return;
    estado.textContent = ""; estado.classList.remove("error");
    enviarBtn.disabled = true; enviarBtn.textContent = "Enviando…";
    try {
      const r = await fetch(DESTINO, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: `Mensaje de ${nombre} – ${actual}`,
          _template: "table",
          _captcha: "false",
          Nombre: nombre,
          Regalo: actual,
          Mensaje: mensaje,
        }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || d.success === false || d.success === "false") throw new Error(d.message || r.status);
      form.hidden = true; gracias.hidden = false;
    } catch (err) {
      estado.textContent = "No se pudo enviar el mensaje. Probá de nuevo en un momento.";
      estado.classList.add("error");
      enviarBtn.disabled = false; enviarBtn.textContent = "Enviar mensaje";
    }
  });

  function abrir(i, btn) {
    const [img, nombre, , precio] = regalos[i];
    document.getElementById("co-img").src = `img/${img}.jpg`;
    document.getElementById("co-img").alt = nombre;
    document.getElementById("co-nombre").textContent = nombre;
    document.getElementById("co-precio").textContent = precio;
    origen = btn;
    actual = nombre;
    resetForm();
    velo.classList.add("abierto");
    velo.setAttribute("aria-hidden", "false");
    document.body.classList.add("bloqueado");
    document.getElementById("cerrar").focus();
  }
  function cerrar() {
    velo.classList.remove("abierto");
    velo.setAttribute("aria-hidden", "true");
    document.body.classList.remove("bloqueado");
    if (origen) origen.focus();
  }

  document.getElementById("lista").addEventListener("click", e => {
    const b = e.target.closest(".comprar");
    if (b) abrir(+b.dataset.i, b);
  });
  document.getElementById("cerrar").addEventListener("click", cerrar);
  velo.addEventListener("click", e => { if (e.target === velo) cerrar(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && velo.classList.contains("abierto")) cerrar(); });

  async function copiarTexto(t) {
    try { await navigator.clipboard.writeText(t); return true; }
    catch {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch {}
      ta.remove(); return ok;
    }
  }
  document.getElementById("co-datos").addEventListener("click", async e => {
    const b = e.target.closest(".copiar");
    if (!b) return;
    if (await copiarTexto(b.dataset.copia)) {
      b.textContent = "Copiado"; b.classList.add("ok");
      setTimeout(() => { b.textContent = "Copiar"; b.classList.remove("ok"); }, 1600);
    }
  });
</script>
</body>
</html>
